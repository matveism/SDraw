<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scan Drawing</title>
  <style>
    body { font-family: Arial; max-width: 500px; margin: 20px auto; }
    video, canvas { width: 100%; margin-top: 10px; }
    button { width: 100%; padding: 10px; margin-top: 10px; }

    #result {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
    }

    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>

<h2>Scan Your Drawing</h2>

<video id="camera" autoplay playsinline></video>
<canvas id="snapshot"></canvas>

<button id="scanBtn">Scan Drawing</button>

<div id="result"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxE9TEZwyIGrCFtFhWeHG8yTdWRKWc0A_Vb02EZl6bvG6fVeWsL3sAHQxD-BC6x2eJ1/exec";

// Force BACK CAMERA ONLY
const constraints = {
  video: {
    facingMode: { exact: "environment" }
  }
};

const video = document.getElementById("camera");
const canvas = document.getElementById("snapshot");
const ctx = canvas.getContext("2d");

// Start camera
navigator.mediaDevices.getUserMedia(constraints)
  .then(stream => {
    video.srcObject = stream;
  })
  .catch(err => {
    document.getElementById("result").innerHTML =
      "<span class='error'>Back camera not available.</span>";
  });

document.getElementById("scanBtn").onclick = async () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  const base64 = canvas.toDataURL("image/png");

  const formData = new FormData();
  formData.append("scan", base64);

  const res = await fetch(SCRIPT_URL, { method: "POST", body: formData });
  const json = await res.json();

  const resultDiv = document.getElementById("result");

  if (!json.match) {
    resultDiv.innerHTML =
      "<span class='error'>❌ ERROR: Drawing NOT registered</span>";
    return;
  }

  resultDiv.innerHTML =
    "<span class='success'>✔ Registered Drawing ID: " + json.match + "</span>";
};
</script>

</body>
</html>
